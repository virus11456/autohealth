# XcodeGen spec — run `xcodegen generate` in this folder to produce
# AutoHealth.xcodeproj (see README.md).
name: AutoHealth
options:
  bundleIdPrefix: com.autohealth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Set your Team ID here or pick it in Xcode → Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AutoHealth:
    type: application
    platform: iOS
    sources:
      - path: AutoHealth
        excludes:
          - "**/.DS_Store"
    info:
      path: AutoHealth/Info.plist
      properties:
        CFBundleDisplayName: AutoHealth
        CFBundleName: AutoHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "AutoHealth 讀取你的心率、心率變異 (HRV)、靜息心率、睡眠、步數、血氧與運動紀錄，用來在手機上計算壓力分數、Body Battery 與睡眠分數。所有資料只留在這台裝置。"
        NSHealthUpdateUsageDescription: "AutoHealth 不會寫入任何健康資料。"
    entitlements:
      path: AutoHealth/AutoHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohealth.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
